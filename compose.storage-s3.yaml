# Append LAST, after production + Timeweb + provider-egress overlays.
# Requires Docker Compose >= 2.24.4 (!override). No service is restarted by this file alone.
services:
  minio:
    profiles: [local-object-storage]
  minio-init:
    profiles: [local-object-storage]
  web:
    environment: &external-storage
      S3_ENDPOINT: ${S3_ENDPOINT:?Set the external HTTPS S3 endpoint}
      S3_REGION: ${S3_REGION:?Set the bucket region}
      S3_BUCKET: ${S3_BUCKET:?Set the private bucket name}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Browser uploads and model reads must not inherit an old minio.localhost address.
      CHAT_ATTACHMENT_S3_ENDPOINT: ${S3_ENDPOINT:?Set the external HTTPS S3 endpoint}
      CHAT_ATTACHMENT_S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    depends_on: !override
      postgres:
        condition: service_healthy
  worker:
    environment: *external-storage
    depends_on: !override
      postgres:
        condition: service_healthy
  pipeline-worker:
    environment: *external-storage
    depends_on: !override
      postgres:
        condition: service_healthy
  migrate:
    environment: *external-storage
  storage-probe:
    profiles: [storage-ops]
    image: reverie-app:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    restart: "no"
    read_only: true
    command: [node, scripts/s3-storage-smoke.mjs, --write-probe]
    environment:
      <<: *external-storage
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_PROBE_ORIGIN: ${PUBLIC_APP_URL:-https://production.apption.space}
    mem_limit: 256m
    cpus: 0.5
  storage-backup:
    profiles: [storage-ops]
    image: reverie-app:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    restart: "no"
    read_only: true
    command: [node, scripts/s3-backup.mjs, --write-snapshot]
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:?Set the external HTTPS S3 endpoint}
      S3_REGION: ${S3_REGION:?Set the bucket region}
      S3_BUCKET: ${S3_BUCKET:?Set the private bucket name}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Separate ops credentials: read source, write backup. Never passed to the app.
      S3_ACCESS_KEY_ID: ${S3_BACKUP_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_BACKUP_SECRET_ACCESS_KEY:-}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-}
    mem_limit: 256m
    cpus: 0.5
