# Layer over compose.production.yaml. Reuse the existing Timeweb Caddy ingress.
name: reverie-image-production
services:
  caddy:
    profiles: [standalone-edge]
  web:
    environment:
      # The shared edge network also has Content Hub's `minio` alias.
      S3_ENDPOINT: http://reverie-image-production-minio-1:9000
    networks:
      default: {}
      edge:
        aliases: [reverie-image-production]
networks:
  edge:
    external: true
    name: ludimogut
